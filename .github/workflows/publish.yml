name: Publish

on:
  push:
    branches:
      - main
    paths:
      - 'packages/*/package.json'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview what would be published without actually publishing'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    # Run for ship/version commits or manual dispatch.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Published new versions')

    permissions:
      id-token: write
      contents: read

    env:
      FORCE_COLOR: 1
      CI: true
      NPM_CONFIG_PROVENANCE: true
      NPM_CONFIG_REGISTRY: 'https://registry.npmjs.org'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install verified pnpm without lifecycle scripts
        # packageManager pins the wrapper tarball; the toolchain lock pins the
        # native tarball. Verify both before executing the native binary.
        run: |
          python3 - <<'PYTHON'
          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import sys
          import tarfile
          from urllib.request import urlopen

          if sys.platform != 'linux' or platform.machine() != 'x86_64':
              raise SystemExit('This publish job requires a Linux x64 runner')
          manager = json.loads(Path('package.json').read_text())['packageManager']
          match = re.fullmatch(r'pnpm@(\d+\.\d+\.\d+)\+sha512\.([a-f0-9]{128})', manager)
          if match is None:
              raise SystemExit('Expected an exact SHA-512-pinned pnpm version')
          version, wrapper_hash = match.groups()

          def download(url):
              with urlopen(url, timeout=60) as response:
                  return response.read()

          wrapper = download(f'https://registry.npmjs.org/pnpm/-/pnpm-{version}.tgz')
          if hashlib.sha512(wrapper).hexdigest() != wrapper_hash:
              raise SystemExit('pnpm wrapper integrity mismatch')
          toolchain_lock = Path('pnpm-lock.yaml').read_text().split('\n---\n', 1)[0]
          entry = re.search(
              rf"^  '@pnpm/exe\.linux-x64@{re.escape(version)}':\n"
              r'    resolution: \{integrity: sha512-([A-Za-z0-9+/=]+)\}$',
              toolchain_lock, re.MULTILINE,
          )
          if entry is None:
              raise SystemExit('Missing native pnpm integrity in the toolchain lock')
          native = download(f'https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-{version}.tgz')
          if hashlib.sha512(native).digest() != base64.b64decode(entry.group(1), validate=True):
              raise SystemExit('pnpm native integrity mismatch')
          target = Path(os.environ['RUNNER_TEMP']) / 'verified-pnpm'
          target.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(native), mode='r:gz') as archive:
              member = archive.getmember('package/pnpm')
              if not member.isfile():
                  raise SystemExit('Expected a regular native pnpm executable')
              (target / 'pnpm').write_bytes(archive.extractfile(member).read())
          (target / 'pnpm').chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as github_path:
              github_path.write(f'{target}\n')
          PYTHON

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        env:
          FORCE_COLOR: 0
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        # Supersedes #200: dependency lifecycle scripts stay disabled in this
        # OIDC-enabled job even when ordinary CI has reviewed build approvals.
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Build releasable packages
        run: pnpm build

      - name: Configure npm registry
        run: |
          cat > "$HOME/.npmrc" <<EOF
          registry=https://registry.npmjs.org/
          @tryghost:registry=https://registry.npmjs.org/
          EOF
          npm config get registry
          npm config get @tryghost:registry

      - name: Determine packages to publish
        id: pubs
        run: |
          to_publish=()
          for pkg in packages/*/package.json; do
            name=$(jq -r .name "$pkg")
            version=$(jq -r .version "$pkg")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "skip $name@$version (already published)"
            else
              echo "queue $name@$version"
              to_publish+=("$(dirname "$pkg")")
            fi
          done
          if [ ${#to_publish[@]} -eq 0 ]; then
            echo "nothing to publish"
            echo "dirs=" >> "$GITHUB_OUTPUT"
          else
            (IFS=,; echo "dirs=${to_publish[*]}") >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.pubs.outputs.dirs != ''
        run: |
          IFS=',' read -ra dirs <<< "${{ steps.pubs.outputs.dirs }}"
          for dir in "${dirs[@]}"; do
            (cd "$dir" && npm publish ${{ (github.event.inputs['dry-run'] == 'true' && '--dry-run') || '' }})
          done

      - uses: tryghost/actions/actions/slack-build@840763ec4113f31c6063f3ca9868c30626a876bc # main
        if: failure()
        with:
          status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
