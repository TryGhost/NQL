packages:
  - 'packages/*'

# Match Yarn Classic's workspace-linking behavior for matching local ranges.
linkWorkspacePackages: true

# Jison's CLI dependencies require an older, vulnerable Underscore version.
overrides:
  underscore: 1.13.8
  # These parents use the public glob/matching APIs supported by the patched majors.
  'glob@13': 14.0.4
  'minimatch@10': 11.0.8

# Nx still calls makeRe(), removed in Minimatch 11. Remove when upstream fixes it.
# https://github.com/nrwl/nx/issues/37727
patchedDependencies:
  'nx@24.0.5': patches/nx@24.0.5.patch

minimumReleaseAge: 4320
strictDepBuilds: true
blockExoticSubdeps: true

allowBuilds:
  # Nx works without its optional install-time setup.
  'nx@24.0.5': false

# Disable implicit executable config discovery; shared policy stays declarative.
pnpmfile: []
